name: Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/**"
      - "docs/**"
      - "skills/**"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test website
        run: pnpm --filter gamepad-controller-website run test

      - name: Build website
        run: pnpm --filter gamepad-controller-website run build

      - name: Guard against publishing design source
        run: |
          if find website/dist -path '*stitch*' -o -path '*design*' | grep -q .; then
            echo "Found design/stitch source files in the build output; refusing to publish." >&2
            find website/dist -path '*stitch*' -o -path '*design*' >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
