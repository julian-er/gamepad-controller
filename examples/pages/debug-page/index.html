<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Page - Gamepad Navigation</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="debug-page.css">
</head>
<body>
    <header class="app-header">
        <a class="home-link" href="../home-page/index.html">← Home</a>
        <span class="spacer"></span>
        <span class="badge">module &amp; util smoke test</span>
    </header>

    <div class="container">
        <h1>🔧 Debug Test - Gamepad Navigation</h1>
        
        <div id="test-status" class="status loading">
            Loading modules...
        </div>

        <div class="test-grid">
            <div class="test-item" tabindex="0" onclick="testClick(1)">Test Item 1</div>
            <div class="test-item" tabindex="0" onclick="testClick(2)">Test Item 2</div>
            <div class="test-item" tabindex="0" onclick="testClick(3)">Test Item 3</div>
            <div class="test-item" tabindex="0" onclick="testClick(4)">Test Item 4</div>
            <div class="test-item" tabindex="0" onclick="testClick(5)">Test Item 5</div>
            <div class="test-item" tabindex="0" onclick="testClick(6)">Test Item 6</div>
        </div>

        <div id="module-status" class="status">
            Module loading status will appear here...
        </div>

        <div id="gamepad-debug" class="status">
            Gamepad debug info will appear here...
        </div>

        <div class="status">
            <h3>🎮 Debug Controls:</h3>
            <button onclick="debugRefresh()">🔄 Refresh Navigation</button>
            <button onclick="debugInfo()">ℹ️ Show Debug Info</button>
            <button onclick="debugElements()">📋 List Elements</button>
            <button onclick="debugStyles()">🎨 Add Example Styles</button>
            <button onclick="debugCSSExamples()">📄 Print CSS Examples</button>
        </div>
    </div>

    <script type="module" src="./debugPage.ts"></script>
</body>
</html>
